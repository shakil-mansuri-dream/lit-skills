schema_version: "1.1"
name: reselect5-shared-selector
tags: [lit-redux-doctor, reselect]
execution:
  prompt: |
    "Each <card-view> shares one selectCardTitle selector. Should each card-view create its own
    selector instance (a factory in the constructor) so the cache stops thrashing? Should we also add
    memoizeOptions: { maxSize: 50 }?" Answer for this repo, in under 150 words.
  runs: 3
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: reselect-5-facts
    type: llm
    criteria: >
      Judge only the recommendation for THIS repo, which is on reselect 5. Mentions of how
      reselect 4.x behaves are background and never a reason to fail. PASS when the answer
      (1) advises against adding a per-instance selector factory, because reselect 5's
      weakMapMemoize caches each (state, id) combination separately, and (2) says
      memoizeOptions maxSize has no effect on 5.0-5.2. FAIL only when the answer tells this
      repo to add the factory or to add maxSize.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lit-(redux-)?doctor"'
